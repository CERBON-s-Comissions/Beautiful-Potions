architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }

    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    api "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}+${minecraft_version}"

    // Fabric Dependencies
    //modImplementation "com.cerbon:cerbons_api-fabric-${minecraft_version}:${cerbons_api_version}"

    //api "dev.onyxstudios.cardinal-components-api:cardinal-components-base:${cardinal_components_version}" // Even though Cardinal Components is shipped with Cerbons API it needs to exist here too or Fabric will complain.
    //implementation "dev.onyxstudios.cardinal-components-api:cardinal-components-world:${cardinal_components_version}"

    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))

    // Useful Mods
//    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
//    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
//
//    modImplementation "curse.maven:jade-324717:${jade_version_fabric}"

    compileOnly("com.terraformersmc:modmenu:${modmenu_version_fabric}") {
        exclude module: "fabric-api"
    }
    runtimeOnly("com.terraformersmc:modmenu:${modmenu_version_fabric}") {
        exclude module: "fabric-api"
    }

    // Architecture
    common(project(path: ":common")) { transitive false }
    shadowBundle(project(path: ":common", configuration: "transformProductionFabric")) { transitive false }
}

shadowJar {
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier.set("")
}

tasks.build.dependsOn shadowJar

//remapJar {
//    injectAccessWidener = true
//    inputFile.set shadowJar.archiveFile
//    dependsOn shadowJar
//    archiveClassifier.set(null)
//}

jar {
    archiveClassifier.set("dev")
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
